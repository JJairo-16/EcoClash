<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comprovació d'autenticació</title>

  <link
    rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css"
  />

  <style>
    body {
      background: #f5f7fb;
    }

    .card-custom {
      border: none;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }

    .card-custom .card-header {
      background: #ffffff;
      border-bottom: 1px solid #eef1f6;
      font-weight: 600;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container py-5">
    <div class="row">
      <div class="col-12 col-lg-8 offset-lg-2">
        <h1 class="mb-4">Estat de l'autenticació</h1>

        <div id="messageBox" class="alert hidden"></div>

        <div id="authForms">
          <div class="card card-custom">
            <div class="card-header">Inici de sessió</div>
            <div class="card-body">
              <div class="form-group">
                <label for="loginEmail">Correu electrònic</label>
                <input type="email" class="form-control" id="loginEmail" />
              </div>

              <div class="form-group">
                <label for="loginPassword">Contrasenya</label>
                <input type="password" class="form-control" id="loginPassword" />
              </div>

              <button type="button" id="loginBtn" class="btn btn-primary mr-2">
                Entrar
              </button>
              <button type="button" id="showSignupBtn" class="btn btn-outline-secondary">
                Registrar un nou usuari
              </button>
            </div>
          </div>

          <div class="card card-custom hidden" id="signupCard">
            <div class="card-header">Registre d'usuari</div>
            <div class="card-body">
              <div class="form-group">
                <label for="signupEmail">Correu electrònic</label>
                <input type="email" class="form-control" id="signupEmail" />
              </div>

              <div class="form-group">
                <label for="signupPassword">Contrasenya</label>
                <input type="password" class="form-control" id="signupPassword" />
              </div>

              <div class="form-group">
                <label for="signupPasswordConfirm">Confirmar contrasenya</label>
                <input type="password" class="form-control" id="signupPasswordConfirm" />
              </div>

              <button type="button" id="signupBtn" class="btn btn-success mr-2">
                Registrar
              </button>
              <button type="button" id="showLoginBtn" class="btn btn-outline-secondary">
                Tornar a l'inici de sessió
              </button>
            </div>
          </div>
        </div>

        <div id="loading" class="alert alert-info">
          Comprovant si l'usuari està autenticat...
        </div>

        <div id="authenticated" class="card card-custom hidden">
          <div class="card-header">Usuari autenticat</div>
          <div class="card-body">
            <div class="mb-2"><strong>UID:</strong> <span id="userUid"></span></div>
            <div class="mb-3"><strong>Email:</strong> <span id="userEmail"></span></div>

            <button type="button" id="logout" class="btn btn-outline-danger">
              Tancar sessió
            </button>
            <button type="button" id="goToStorageTestBtn" class="btn btn-outline-primary ml-2">
              Obrir prova d'emmagatzematge
            </button>
          </div>
        </div>

        <div id="notAuthenticated" class="alert alert-warning hidden">
          No hi ha cap usuari autenticat.
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from "./js/config.js";
    import {
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    function showMessage(text, type) {
      const box = document.getElementById("messageBox");
      box.innerText = text;
      box.className = "alert alert-" + type;
      box.classList.remove("hidden");

      setTimeout(() => {
        box.classList.add("hidden");
      }, 2500);
    }

    function resetUI() {
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("authenticated").classList.add("hidden");
      document.getElementById("notAuthenticated").classList.add("hidden");
    }

    function showLoginForm() {
      document.getElementById("authForms").classList.remove("hidden");
      document.getElementById("signupCard").classList.add("hidden");
    }

    function showSignupForm() {
      document.getElementById("authForms").classList.remove("hidden");
      document.getElementById("signupCard").classList.remove("hidden");
    }

    function updateAuthUI(user) {
      resetUI();

      if (user) {
        document.getElementById("authForms").classList.add("hidden");
        document.getElementById("authenticated").classList.remove("hidden");
        document.getElementById("userUid").innerText = user.uid || "";
        document.getElementById("userEmail").innerText = user.email || "";
      } else {
        document.getElementById("authForms").classList.remove("hidden");
        document.getElementById("notAuthenticated").classList.remove("hidden");
        showLoginForm();
      }
    }

    onAuthStateChanged(auth, (user) => {
      updateAuthUI(user);
    });

    document.getElementById("showSignupBtn").addEventListener("click", () => {
      showSignupForm();
    });

    document.getElementById("showLoginBtn").addEventListener("click", () => {
      showLoginForm();
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        showMessage("Introdueix email i contrasenya", "danger");
        return;
      }

      try {
        const credential = await signInWithEmailAndPassword(auth, email, password);
        updateAuthUI(credential.user);
        showMessage("Sessió iniciada correctament", "success");
      } catch (error) {
        showMessage(error.message || "Error en iniciar sessió", "danger");
        console.error(error);
      }
    });

    document.getElementById("signupBtn").addEventListener("click", async () => {
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;
      const passwordConfirm = document.getElementById("signupPasswordConfirm").value;

      if (!email || email.indexOf("@") < 1) {
        showMessage("Email incorrecte", "danger");
        return;
      }

      if (!password) {
        showMessage("La contrasenya és obligatòria", "danger");
        return;
      }

      if (password.length < 8) {
        showMessage("La contrasenya ha de tenir un mínim de 8 caràcters", "danger");
        return;
      }

      if (password !== passwordConfirm) {
        showMessage("Les contrasenyes no coincideixen", "danger");
        return;
      }

      try {
        const credential = await createUserWithEmailAndPassword(auth, email, password);
        updateAuthUI(credential.user);
        showMessage("Usuari registrat correctament", "success");
      } catch (error) {
        showMessage(error.message || "Error al registrar l'usuari", "danger");
        console.error(error);
      }
    });

    document.getElementById("logout").addEventListener("click", async () => {
      try {
        await signOut(auth);
        updateAuthUI(null);
        showMessage("Sessió tancada correctament", "success");
      } catch (error) {
        showMessage(error.message || "Error al tancar la sessió", "danger");
        console.error(error);
      }
    });

    document.getElementById("goToStorageTestBtn").addEventListener("click", () => {
      globalThis.location.href = "storage-test.html";
    });
  </script>
</body>
</html>
