<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Registre</title>

  <!-- Flatpickr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />

  <!-- Tu CSS -->
  <link rel="stylesheet" href="./css/login.css" />
</head>

<body>
  <header class="header">
    <nav class="navbar">
      <div class="navbar-container">
        <a href="login.html" class="navbar-logo">
          <img src="img/EcoClash.webp" class="navbar-logo-img" alt="EcoClash Logo">
        </a>

        <ul class="navbar-menu">
          <li class="navbar-item">
            <span class="navbar-link active" style="cursor:default;">Inici de sessió</span>
          </li>
          <li class="navbar-item">
            <a href="help.html" class="navbar-link active">Ajuda</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="forms-wrapper">

        <!-- LOGIN -->
        <div class="form-block">
          <h2 class="form-title">Iniciar sessió</h2>

          <form id="login-form" novalidate>
            <input id="login-user" class="form-input" type="email" placeholder="Correu electrònic"
              autocomplete="email" />

            <input id="login-pass" class="form-input" type="password" placeholder="Contrasenya"
              autocomplete="current-password" />

            <button class="btn btn-primary" type="submit">
              Entrar
            </button>

            <div id="login-msg" class="message-slot"></div>
          </form>
        </div>

        <!-- REGISTER -->
        <div class="form-block">
          <h2 class="form-title">Registrar-se</h2>

          <form id="register-form" novalidate>
            <input id="reg-username" class="form-input" type="text" placeholder="Username" autocomplete="username" />

            <input id="reg-name" class="form-input" type="text" placeholder="Nom" autocomplete="given-name" />

            <input id="reg-surname" class="form-input" type="text" placeholder="Cognom" autocomplete="family-name" />

            <input id="reg-lastname" class="form-input" type="text" placeholder="Segon cognom (opcional)" />

            <input id="reg-phone" class="form-input" type="tel" placeholder="Telèfon (opcional)" autocomplete="tel" />

            <input id="reg-birth" class="form-input" type="text" placeholder="dd/mm/aaaa" autocomplete="bday"
              readonly />

            <input id="reg-email" class="form-input input-span-2" type="email" placeholder="Correu electrònic"
              autocomplete="email" />

            <input id="reg-pass" class="form-input" type="password" placeholder="Contrasenya"
              autocomplete="new-password" />

            <input id="reg-pass2" class="form-input" type="password" placeholder="Repetir contrasenya"
              autocomplete="new-password" />

            <div class="submit-row input-span-2">
              <button class="btn btn-primary" type="submit">
                Registrar-me
              </button>
            </div>

            <div id="reg-msg" class="message-slot input-span-2"></div>
          </form>
        </div>

      </div>
    </section>
  </main>

  <!-- Flatpickr -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <!-- Tu JS -->
  <script>
    flatpickr("#reg-birth", {
      dateFormat: "d/m/Y",
      maxDate: "today",
      disableMobile: true,
      allowInput: false,
      clickOpens: true,
      monthSelectorType: "static"
    });
  </script>
  <script type="module" src="./js/login.js"></script>
</body>

</html>
