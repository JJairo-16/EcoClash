<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoClash - Inici de sessió</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="header">
  <nav class="navbar">
    <div class="navbar-container">
      <a href="login.html" class="navbar-logo">
        <img src="img/EcoClash.webp" class="navbar-logo-img">
      </a>

      <ul class="navbar-menu">
        <li class="navbar-item">
          <span class="navbar-link active" style="cursor:default;">Inici de sessió</span>
        </li>
        <li class="navbar-item">
          <!-- 🔗 BOTÓN AYUDA FUNCIONAL -->
          <a href="help.html" class="btn btn-secondary">Ajuda</a>
        </li>
      </ul>
    </div>
  </nav>
</header>

<main class="main-content">
<section class="dashboard" style="max-width:1000px; margin:0 auto;">

<div class="welcome-card card" style="margin-bottom:32px;">
  <h1>ACCÉS A ECOCLASH</h1>
  <p>Inicia sessió o crea un compte nou.</p>
</div>

<div style="display:grid; grid-template-columns:1fr 1fr; gap:32px;">

<!-- LOGIN -->
<section>
<div class="card" style="padding:24px;">
<h2 style="margin-bottom:20px;">Inici de sessió</h2>

<form id="login-form">

<input id="login-user" type="email" class="form-input" placeholder="Correu electrònic" style="margin-bottom:16px;">
<input id="login-pass" type="password" class="form-input" placeholder="Contrasenya" style="margin-bottom:24px;">

<div style="display:flex; justify-content:center;">
  <button class="btn btn-primary" type="submit" style="width:200px;">
    Iniciar sessió
  </button>
</div>

<div id="login-msg" style="margin-top:16px; text-align:center;"></div>
</form>
</div>
</section>

<!-- REGISTER -->
<section>
<div class="card" style="padding:24px;">
<h2 style="margin-bottom:20px;">Registrar-se</h2>

<form id="register-form">

<input id="reg-username" class="form-input" placeholder="Username" style="margin-bottom:12px;">
<input id="reg-name" class="form-input" placeholder="Nom" style="margin-bottom:12px;">
<input id="reg-surname" class="form-input" placeholder="Cognom" style="margin-bottom:12px;">
<input id="reg-lastname" class="form-input" placeholder="Segon cognom (opcional)" style="margin-bottom:12px;">
<input id="reg-phone" class="form-input" placeholder="Telèfon (opcional)" style="margin-bottom:12px;">
<input id="reg-birth" type="date" class="form-input" style="margin-bottom:12px;">
<input id="reg-email" type="email" class="form-input" placeholder="Correu electrònic" style="margin-bottom:12px;">
<input id="reg-pass" type="password" class="form-input" placeholder="Contrasenya" style="margin-bottom:12px;">
<input id="reg-pass2" type="password" class="form-input" placeholder="Repetir contrasenya" style="margin-bottom:24px;">

<div style="display:flex; justify-content:center;">
  <button class="btn btn-primary" type="submit" style="width:200px;">
    Registrar-me
  </button>
</div>

<div id="reg-msg" style="margin-top:16px; text-align:center;"></div>
</form>
</div>
</section>

</div>
</section>
</main>

<script>
const KEY_USERS = "users";

function getUsers(){
  return JSON.parse(localStorage.getItem(KEY_USERS) || "[]");
}

function saveUsers(users){
  localStorage.setItem(KEY_USERS, JSON.stringify(users));
}

function msg(id, text, ok){
  document.getElementById(id).innerHTML =
    `<p style="color:${ok ? 'green':'red'}">${text}</p>`;
}

/* 🔐 REGEX CONTRASEÑA */
const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

function validarPassword(pass){
  return passwordRegex.test(pass);
}

/* REGISTER */
document.getElementById("register-form").onsubmit = e=>{
  e.preventDefault();

  const username = document.getElementById("reg-username").value.trim();
  const name = document.getElementById("reg-name").value.trim();
  const surname = document.getElementById("reg-surname").value.trim();
  const lastname = document.getElementById("reg-lastname").value.trim();
  const phone = document.getElementById("reg-phone").value.trim();
  const birth = document.getElementById("reg-birth").value;
  const email = document.getElementById("reg-email").value.trim();
  const pass = document.getElementById("reg-pass").value;
  const pass2 = document.getElementById("reg-pass2").value;

  if(!username || !name || !surname || !birth || !email || !pass){
    msg("reg-msg","Omple els camps obligatoris",false);
    return;
  }

  if(pass !== pass2){
    msg("reg-msg","Les contrasenyes no coincideixen",false);
    return;
  }

  if(!validarPassword(pass)){
    msg("reg-msg",
      "La contrasenya ha de tenir mínim 8 caràcters, una majúscula, una minúscula, un número i un símbol",
      false
    );
    return;
  }

  const users = getUsers();

  if(users.some(u => u.username === username)){
    msg("reg-msg","Aquest usuari ja existeix",false);
    return;
  }

  users.push({
    username,
    name,
    surname,
    lastname,
    phone,
    birth,
    email,
    password: pass
  });

  saveUsers(users);

  msg("reg-msg","Registrat correctament!",true);
};

/* FEEDBACK EN TIEMPO REAL */
document.getElementById("reg-pass").addEventListener("input", e=>{
  const pass = e.target.value;

  if(pass === ""){
    document.getElementById("reg-msg").innerHTML = "";
    return;
  }

  if(validarPassword(pass)){
    msg("reg-msg","Contrasenya segura ✔",true);
  } else {
    msg("reg-msg","Contrasenya massa feble ❌",false);
  }
});

/* LOGIN */
document.getElementById("login-form").onsubmit = e=>{
  e.preventDefault();

  const user = document.getElementById("login-user").value.trim();
  const pass = document.getElementById("login-pass").value;

  const users = getUsers();

  const found = users.find(u =>
    (u.username === user || u.email === user) &&
    u.password === pass
  );

  if(!found){
    msg("login-msg","Credencials incorrectes",false);
    return;
  }

  window.location.href = "dashboard.html";
};
</script>

</body>
</html>
